<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KLC Voucher Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  body { font-family: 'Be Vietnam Pro', sans-serif; }

  /* ===== VOUCHER CARD ===== */
  .voucher {
    position: absolute;
    width: 36vw;
    background: #fff;
    border-radius: 4vw;
    padding: 3vw 2.5vw 3.5vw;
    box-sizing: border-box;
    text-align: center;
    border: 0.8vw solid #F5B700;
    animation: pulse 1.2s ease-in-out infinite, glow 1.2s ease-in-out infinite;
  }
  .pos-tr { top: 22vh; right: 3vw; }
  .pos-tl { top: 22vh; left: 3vw; }
  .pos-mr { top: 45vh; right: 3vw; }
  .pos-ml { top: 45vh; left: 3vw; }
  .pos-c  { top: 50%; left: 50%; transform-origin: center; }
  .pos-c.voucher { animation: pulseC 1.2s ease-in-out infinite, glow 1.2s ease-in-out infinite; }

  .badge {
    display: inline-block;
    background: #D7262B; color: #fff;
    font-weight: 900; font-size: 3.6vw;
    padding: 0.8vw 2.4vw; border-radius: 2vw;
    letter-spacing: 0.2vw;
  }
  .label { font-weight: 800; font-size: 3.6vw; color: #1A1A1A; margin-top: 2vw; line-height: 1.2; }
  .amount {
    font-weight: 900; font-size: 11vw; line-height: 1.05;
    color: #D7262B; margin: 1vw 0;
    animation: flash 0.9s steps(1) infinite;
  }
  .note { font-size: 2.4vw; line-height: 1.3; color: #555; font-weight: 500; margin-bottom: 2.5vw; }
  .cta {
    display: inline-block;
    background: #D7262B; color: #fff;
    font-weight: 800; font-size: 3.4vw; white-space: nowrap;
    padding: 1.6vw 3vw; border-radius: 6vw;
    animation: blink 0.8s ease-in-out infinite;
  }
  .shine { position: absolute; inset: 0; border-radius: 3.2vw; overflow: hidden; pointer-events: none; }
  .shine::after {
    content: ""; position: absolute; top: -20%; left: -60%;
    width: 40%; height: 140%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.75), transparent);
    transform: skewX(-20deg);
    animation: sweep 3s ease-in-out infinite;
  }

  /* ===== TICKER (optional) ===== */
  .ticker {
    position: absolute; left: 0; right: 0; top: 8vh;
    background: #D7262B; color: #fff;
    font-weight: 800; font-size: 4.2vw;
    padding: 1.6vw 0; white-space: nowrap; overflow: hidden;
    border-top: 0.6vw solid #F5B700; border-bottom: 0.6vw solid #F5B700;
  }
  .ticker-track { display: inline-block; padding-left: 100%; animation: scroll var(--dur, 18s) linear infinite; }

  @keyframes pulse  { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  @keyframes pulseC { 0%,100% { transform: translate(-50%,-50%) scale(1); } 50% { transform: translate(-50%,-50%) scale(1.06); } }
  @keyframes glow   { 0%,100% { box-shadow: 0 0 0 0 rgba(245,183,0,0.0); } 50% { box-shadow: 0 0 6vw 1vw rgba(245,183,0,0.85); } }
  @keyframes flash  { 0% { color: #D7262B; } 50% { color: #F5A300; } }
  @keyframes blink  { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(0.94); } }
  @keyframes sweep  { 0% { left: -60%; } 60%,100% { left: 130%; } }
  @keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-100%); } }
</style>
</head>
<body>

<div id="voucher" class="voucher">
  <div class="shine"></div>
  <div class="badge" id="badge">11.11</div>
  <div class="label" id="label">VOUCHER LIVE</div>
  <div class="amount" id="amount">50K</div>
  <div class="note" id="note">Chỉ áp dụng trong buổi live</div>
  <div class="cta" id="cta">NHẬN NGAY ➜</div>
</div>

<div id="ticker" class="ticker" style="display:none"><span class="ticker-track" id="tickerText"></span></div>

<script>
  // Đổi nội dung bằng cách thêm vào cuối link, ví dụ:
  // voucher.html?so=500K&nhan=VOUCHER%20LIVE&vitri=tr&chu=Hotline%200886.99.22.11
  const p = new URLSearchParams(location.search);
  const set = (id, key) => { if (p.has(key)) document.getElementById(id).textContent = p.get(key); };
  set('amount', 'so');       // số tiền voucher
  set('label', 'nhan');      // dòng chữ trên số tiền
  set('badge', 'tem');       // tem đỏ trên cùng (11.11)
  set('note', 'ghichu');     // ghi chú nhỏ
  set('cta', 'nut');         // chữ trên nút

  // Vị trí: tr = trên phải, tl = trên trái, mr = giữa phải, ml = giữa trái, c = chính giữa
  const pos = p.get('vitri') || 'tr';
  document.getElementById('voucher').classList.add('pos-' + pos);

  // Kích thước: co = 1 (mặc định), 1.3 to hơn, 0.8 nhỏ hơn
  const co = parseFloat(p.get('co') || '1');
  if (co !== 1) document.getElementById('voucher').style.zoom = co;

  // Ẩn voucher: an=1
  if (p.get('an') === '1') document.getElementById('voucher').style.display = 'none';

  // Chữ chạy (tùy chọn): chu=Nội dung 1|Nội dung 2|Nội dung 3
  if (p.has('chu')) {
    const items = p.get('chu').split('|').map(s => s.trim()).filter(Boolean);
    document.getElementById('tickerText').textContent = items.join('   ★   ');
    const t = document.getElementById('ticker');
    t.style.display = 'block';
    const len = items.join('').length;
    t.style.setProperty('--dur', Math.max(12, len * 0.22) + 's');
  }
</script>
</body>
</html>
