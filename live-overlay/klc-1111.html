<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KLC 11.11 Overlay</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  #ov { position: absolute; left: 0; top: 0; width: 100%; height: auto; display: block; pointer-events: none; }
  #vid { position: absolute; left: 0; top: 0; width: 100%; height: auto; display: none; pointer-events: none; }
</style>
</head>
<body>
<!-- Mặc định: ảnh động WebP nền trong suốt (chạy được trên iPhone/PRISM, Android, OBS) -->
<img id="ov" src="klc-1111.webp?v=4" alt="">
<!-- Tùy chọn ?video=1: video WebM trong suốt gốc 1080x1920 (chỉ dùng cho OBS / Chrome máy tính) -->
<video id="vid" muted loop autoplay playsinline preload="auto"></video>
<script>
  const q = new URLSearchParams(location.search);
  // cach=6 -> đẩy overlay xuống 6% chiều ngang (khi bị tên Page che)
  const cach = parseFloat(q.get('cach') || '0');
  // co=0.9 -> thu nhỏ còn 90% (giữa màn hình)
  // co=0.85 (mặc định) -> overlay bằng 85% bề ngang; co=1 = to hết cỡ; co=0.75 = nhỏ hơn nữa
  const co = Math.min(1, Math.max(0.5, parseFloat(q.get('co') || '0.85')));
  // khi thu nhỏ: cách mép trên 2vw và bo góc cho giống khung thẻ
  const topOff = q.has('cach') ? cach : (co < 1 ? 2 : 0);
  const apply = el => {
    el.style.top = topOff + 'vw';
    if (co !== 1) {
      el.style.width = (co * 100) + '%';
      el.style.left = ((1 - co) * 50) + '%';
      el.style.borderRadius = '3vw';
    }
  };
  if (q.get('video') === '1') {
    const v = document.getElementById('vid');
    v.src = 'klc-1111.webm?v=4'; v.style.display = 'block';
    document.getElementById('ov').style.display = 'none';
    apply(v); v.play().catch(() => {});
  } else {
    apply(document.getElementById('ov'));
  }
</script>
</body>
</html>
